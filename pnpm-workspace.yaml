# Only these packages may run install scripts (they download platform binaries).
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
  - '@cloudflare/vitest-plugin@1.4.4'
  # First-party design system, published by us: every version, since a release is installed the day
  # it ships. The rest of the policy still holds back fresh third-party versions.
  - '@shipibo-studio/georg-ds'
